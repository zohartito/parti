name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: Build .gha (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 7
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 7.0.x

      - name: Restore
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Parti.Core.Tests/Parti.Core.Tests.csproj --configuration Release --no-build --logger "console;verbosity=minimal"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: parti-plugin
          path: src/Parti.Components/bin/Release/net7.0/Parti.gha
          if-no-files-found: error

  mcp:
    name: Check MCP server (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.11'

      - name: Install MCP server
        working-directory: mcp/parti_mcp
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Import check
        working-directory: mcp/parti_mcp
        run: python -c "import parti_mcp"
